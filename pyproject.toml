[project]
name = "inventory-service"
version = "1.0.0"
description = "Inventory management API built with FastAPI, SQLAlchemy 2 and Pydantic v2."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.160",
    "pydantic>=2.12",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.50",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
